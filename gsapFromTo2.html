<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .box{
      width: 100px;
      height: 100px;
      background-color: #f85a5a;
      corner-shape: squircle;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .circle{
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: #07baf1;
      transform: translate(-50%, -50%);
    }
  </style>
  <title>gsap.fromTo() 2</title>
</head>
<body>
  <div class="box"></div>
  <div class="circle"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script>
    let stepAry = [];
    window.addEventListener("click", function(e){
      if(stepAry.length < 2){
        stepAry.push([e.pageX, e.pageY]);
        createCircle(e);
        if(stepAry.length == 2){
          console.log("播動畫");
          gsap.fromTo(".box", {
            x: stepAry[0][0],
            y: stepAry[0][1],
          }, {
            x: stepAry[1][0],
            y: stepAry[1][1],
            duration: 2,
            onComplete: function(){
              // 動畫跑完清空
              stepAry = [];
            }
          })
          // 同時間清空
          // stepAry = [];
        }
      }
    });


    function createCircle(e){
      console.log("建立圓");
      console.log(e.pageX, e.pageY);
      
    }
  </script>
</body>
</html>

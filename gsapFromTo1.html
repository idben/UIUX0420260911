<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .box{
      width: 100px;
      height: 100px;
      background-color: #f85a5a;
    }
  </style>
  <title>gsap.fromTo() 1</title>
</head>
<body>
  <div class="box"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script>

    requestIdleCallback(() => {
      // 0, 800
      // 550, 0
      // gsap.to(".box", {
      //   duration: 0,
      //   y: 0,
      //   x: 550
      // })
      gsap.fromTo(".box", {
        x: 0,
        y: 800
      }, {
        x: 550,
        y: 0,
        duration: 2
      });
    })
  </script>
</body>
</html>

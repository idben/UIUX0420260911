<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .title{
      font-family: sans-serif;
      font-size: 60px;
      font-weight: bold;
    }
  </style>
  <title>gsap.from() 2</title>
</head>
<body>
  <div class="title">滾滾長江東似水</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script>
    requestIdleCallback(() => {
      gsap.from(".title", {
        duration: 1,
        opacity: 0,
        scale: 2
      });
    });
  </script>
</body>
</html>

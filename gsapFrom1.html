<!DOCTYPE html>
<html lang="zh-hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .box{
      width: 100px;
      height: 100px;
      background-color: #f85a5a;
    }
  </style>
  <title>gsap.from() 1</title>
</head>
<body>
  <div class="box"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script>
    requestIdleCallback(() => {
      gsap.from(".box", {
        duration: 1,
        x: -1000,
        rotation: 720
      });
    })
  </script>
</body>
</html>
